<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SPOTS, project for spring 3" />
    <meta name="keywords" content="interactivedesign, webpage, practice, se" />
    <meta name="author" content="Darwin Montaleza" />

    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="<%= require('./images/logo.svg')%>"
          id="header-logo"
          alt="Spot logo"
          class="header-logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-btn">
              <img
                class="profile__pencil-icon"
                src="<%= require('./images/pencil-light.svg')%>"
                alt="pencil icon"
              />
            </button>

            <img
              src="<%= require('./images/avatar.jpg')%>"
              id="profile__avatar"
              alt="Bessie Coleman"
              class="profile__avatar"
            />
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button aria-label="" type="button" class="profile__edit-btn">
              <img
                src="<%= require('./images/pencil.svg')%>"
                alt="pencil icon"
              />
              Edit profile
            </button>
          </div>
          <button aria-label="" type="button" class="profile__add-btn">
            <img src="<%=require('./images/plus.svg')%>" alt="Plus icon" />
            <span class="profile__add-btn-title">New Post</span>
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button class="card__delete-button" type="button"></button>
                <img src="" alt="" class="card__image" />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <div class="card__like-container">
                    <button
                      aria-label="Like"
                      type="button"
                      class="card__like-btn"
                    ></button>
                    <span class="card__like-count"></span>
                  </div>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <h3 class="footer__description">2025&copy;Spots</h3>
      </footer>
      <div class="modal" id="edit-modal">
        <div class="modal__container">
          <button class="modal__close-btn"></button>
          <h2 class="modal__title">Edit profile</h2>
          <form name="edit-profile" class="modal__form" novalidate>
            <label for="profile-name-input" class="modal__label"
              >Name
              <input
                required
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Type your name"
                minlength="2"
                maxlength="40"
              />
              <span id="profile-name-input-error" class="modal__error"></span>
            </label>
            <label for="profile-description-input" class="modal__label"
              >Description
              <input
                required
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Description yourself"
                minlength="2"
                maxlength="200"
              />
              <span
                id="profile-description-input-error"
                class="modal__error"
              ></span>
            </label>
            <button aria-label="" type="submit" class="modal__submit-btn">
              Save
            </button>
          </form>
        </div>
      </div>
      <!-- Modal - Add Card-->
      <div class="modal" id="add-card-modal">
        <div class="modal__container">
          <button aria-label="" type="submit" class="modal__close-btn"></button>
          <h2 class="modal__title">New Post</h2>
          <form
            name="modal__form"
            class="modal__form"
            id="add-card-form"
            novalidate
          >
            <label class="modal__label" for="add-card-link-input">
              Image Link
              <input
                required
                id="add-card-link-input"
                class="modal__input"
                name="link"
                placeholder="Paste a link to the picture"
                type="url"
              />
              <span id="add-card-link-input-error" class="modal__error"></span>
            </label>
            <label class="modal__label" for="add-card-name-input">
              Caption
              <input
                required
                id="add-card-name-input"
                class="modal__input"
                name="name"
                placeholder="Type your caption"
                type="text"
                minlength="2"
                maxlength="30"
              />
              <span id="add-card-name-input-error" class="modal__error"></span>
            </label>
            <button aria-label="" type="submit" class="modal__submit-btn">
              Save
            </button>
          </form>
        </div>
      </div>
      <!-- Modal - Preview-->
      <div class="modal modal_type_preview" id="preview-modal">
        <div class="modal__image-container">
          <button
            class="modal__close-btn modal__close-btn_type_preview"
            type="button"
          ></button>
          <img src="#" alt="#" class="modal__image" />
          <p class="modal__caption"></p>
        </div>
      </div>
      <!--MODAL - EDIT AVATAR-->
      <div class="modal" id="avatar-modal">
        <div class="modal__container">
          <button class="modal__close-btn"></button>
          <h2 class="modal__title">Edit Avatar</h2>
          <form class="modal__form" id="edit-avatar-form" novalidate>
            <label class="modal__label" for="profile-avatar-input">
              Avatar
              <input
                required
                name="avatar"
                id="profile-avatar-input"
                type="url"
                class="modal__input"
                placeholder="Avatar URL"
              />
              <span id="profile-avatar-input-error" class="modal__error"></span>
            </label>
            <button aria-label="" type="submit" class="modal__submit-btn">
              Save
            </button>
          </form>
        </div>
      </div>
      <!--MODAL - Delete card-->
      <div class="modal modal_type_preview" id="delete-modal">
        <div class="modal__container-delete">
          <button
            class="modal__close-btn modal__close-btn_type_preview_delete"
            type="button"
          ></button>
          <label class="modal__label-delete">
            Are you sure you want to delete this image?
          </label>
          <form class="modal__form-delete" id="delete-form" novalidate>
            <button
              aria-label=""
              type="submit"
              class="modal__submit-btn-delete"
              id="delete-btn"
            >
              Delete...
            </button>
            <button
              aria-label=""
              type="button"
              class="modal__submit-btn-cancel"
              id="cancel-btn"
            >
              Cancel
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
